name: sync-picard-mechanics

on:
  push:
    branches:
      - sync/picard-main-20260909
    paths:
      - .github/workflows/sync-picard-mechanics.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/picard-main-20260909
      - name: Apply mechanical Picard synchronization
        run: python3 scripts/apply_sync_picard.py
      - name: Commit synchronized mechanics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sashimi_c.py sashimi_c_itamae_migration.py pyproject.toml README.md
          git commit -m "sync: expose Picard as explicit non-default solver"
          git push
