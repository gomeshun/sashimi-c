name: Refresh lockfile (temporary)
on:
  push:
    branches: [packaging/sashimi-itamae-dependency-20260909]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: packaging/sashimi-itamae-dependency-20260909
      - uses: astral-sh/setup-uv@v6
      - run: uv lock
      - name: Commit lockfile
        run: |
          if git diff --quiet -- uv.lock; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "build: refresh lockfile for sashimi-itamae"
          git push origin HEAD:packaging/sashimi-itamae-dependency-20260909
