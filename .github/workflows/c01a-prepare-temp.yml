name: c01a-prepare-temp

on:
  push:
    branches: [architecture/c-01a-survival-component-20260909]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture/c-01a-survival-component-20260909
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - name: Apply mechanical adapter patch
        run: python scripts/apply_c01a_survival_component.py
      - name: Refresh lockfile for promoted ITAMAE revision
        run: uv lock
      - name: Format touched Python files
        run: uvx ruff format sashimi_c_itamae_components.py sashimi_c_itamae_migration.py tests/test_itamae_components.py
      - name: Commit prepared files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sashimi_c_itamae_components.py sashimi_c_itamae_migration.py tests/test_itamae_components.py uv.lock
          if git diff --cached --quiet; then
            echo "No preparation changes required."
            exit 0
          fi
          git commit -m "architecture: wire C survival component"
          git push origin HEAD:architecture/c-01a-survival-component-20260909
