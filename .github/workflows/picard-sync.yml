name: picard-sync

on:
  push:
    branches: [itamae-migration]
  pull_request:
    branches: [main, itamae-migration]
  workflow_dispatch:

jobs:
  standalone-picard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install standalone Picard test dependencies
        run: python -m pip install numpy scipy pytest
      - name: Run standalone Picard accuracy tests
        run: python -m pytest -q tests/test_picard_tidal_stripping.py

  migration-comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out canonical ITAMAE input
        uses: actions/checkout@v4
        with:
          repository: gomeshun/itamae
          ref: 94a1bc54a02fc698204cf20e7c41b8e57df3e614
          path: .itamae
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Create clean comparison environment
        run: uv venv --python 3.11 .venv-picard
      - name: Install candidate and ITAMAE
        run: |
          uv pip install --python .venv-picard/bin/python ./.itamae
          uv pip install --python .venv-picard/bin/python ".[test]"
      - name: Run migration Picard comparison regressions
        run: .venv-picard/bin/python -m pytest -q tests/test_picard_migration_sync.py
      - name: Generate full small-catalog comparison artifact
        run: .venv-picard/bin/python scripts/picard_sync_comparison.py --output picard-sync-comparison.json
      - name: Upload Picard comparison diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: picard-sync-comparison
          path: picard-sync-comparison.json
