name: Usage walkthrough
'on':
  pull_request: null
  push:
    branches:
    - main
    - itamae-migration
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
jobs:
  walkthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - uses: gomeshun/sashimi-family/.github/actions/changed-paths@42a964b21287f802ea323146144ee6784229bbf2
      id: changes
      with:
        paths: |
          src/**
          *.py
          *.toml
          *.cfg
          MANIFEST.in
          uv.lock
          requirements*.txt
          data/**
          .github/workflows/usage-walkthrough.yml
          .github/actions/**
          notebooks/usage_walkthrough.ipynb
          scripts/execute_walkthrough.py
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
      if: steps.changes.outputs.changed == 'true'
    - name: Install candidate and declared demo dependencies
      run: |
        python -m pip install --upgrade pip
        export SASHIMI_C_SOURCE_REVISION="$(git rev-parse HEAD)"
        python -m pip install 'sashimi-itamae @ git+https://github.com/gomeshun/itamae.git@23d01e8758a88b061b87de9e488c38ec89fd8e4f'
        python -m pip install '.[demo]' nbformat nbclient
      if: steps.changes.outputs.changed == 'true'
    - name: Execute all cells in a fresh kernel
      run: python scripts/execute_walkthrough.py
      if: steps.changes.outputs.changed == 'true'
    - uses: actions/upload-artifact@v4
      with:
        name: sashimi-c-usage-walkthrough
        path: artifacts/usage_walkthrough.executed.ipynb
        if-no-files-found: error
      if: steps.changes.outputs.changed == 'true'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event_name
    == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
