name: Usage walkthrough
on:
  pull_request:
  push:
    branches: [main, itamae-migration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  walkthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install candidate and declared demo dependencies
        run: |
          python -m pip install --upgrade pip
          export SASHIMI_C_SOURCE_REVISION="$(git rev-parse HEAD)"
          python -m pip install 'sashimi-itamae @ git+https://github.com/gomeshun/itamae.git@e5c77cdf2832104752d641dd553902fc507885ba'
          python -m pip install '.[demo]' nbformat nbclient
      - name: Execute all cells in a fresh kernel
        run: python scripts/execute_walkthrough.py
      - uses: actions/upload-artifact@v4
        with:
          name: sashimi-c-usage-walkthrough
          path: artifacts/usage_walkthrough.executed.ipynb
          if-no-files-found: error
