name: fix-picard-doc

on:
  push:
    branches: [feat/picard-default]
    paths:
      - .github/workflows/fix-picard-doc.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/picard-default

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Fix method-list indentation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('sashimi_c.py')
          s = p.read_text()
          old = ('                                   - "picard_table" : use the precomputed third-order Picard-iteration table.\n'
                 '            - "odeint" : use odeint to solve the differential equation.')
          new = ('                                   - "picard_table" : use the precomputed third-order Picard-iteration table.\n'
                 '                                   - "odeint" : use odeint to solve the differential equation.')
          if old not in s:
              raise SystemExit('Expected documentation pattern not found')
          s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Install test dependencies
        run: python -m pip install numpy scipy pytest

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sashimi_c.py
          git commit -m "Fix Picard method documentation indentation"
          git push origin HEAD:feat/picard-default
