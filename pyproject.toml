[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sashimi-c"
version = "2.0.0rc1"
description = "Semi-Analytical SubHalo Inference ModelIng for cold dark matter"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Shin'ichiro Ando"},
  {name = "Nagisa Hiroshima"},
  {name = "Shunichi Horigome"},
  {name = "Ariane Dekker"},
]
dependencies = [
  "sashimi-itamae>=0.2.0rc1,<0.3",
  "numpy>=1.26",
  "scipy>=1.11",
  "tqdm>=4.66",
]

[project.optional-dependencies]
demo = [
  "ipykernel>=6",
  "matplotlib>=3.8",
  "nbconvert>=7",
]
itamae = [
]
test = [
  "pytest>=8",
  "setuptools>=77",
]

[project.urls]
Repository = "https://github.com/gomeshun/sashimi-c"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "boost_iteration",
  "boost_iteration_prompt_cusps",
  "picard_tidal_stripping",
  "prompt_cusps",
  "sashimi_c_boost",
  "sashimi_c_data",
  "sashimi_c_itamae",
  "sashimi_c_itamae_catalog",
  "sashimi_c_itamae_components",
  "sashimi_c_itamae_migration",
  "sashimi_c_itamae_variance",
  "sashimi_c_physics",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.uv.sources]
sashimi-itamae = {git = "https://github.com/gomeshun/itamae.git", rev = "23d01e8758a88b061b87de9e488c38ec89fd8e4f"}
