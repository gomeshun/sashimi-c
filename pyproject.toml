[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sashimi-c"
version = "1.2.0"
description = "Semi-Analytical SubHalo Inference ModelIng for cold dark matter"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  {name = "Shin'ichiro Ando"},
  {name = "Nagisa Hiroshima"},
  {name = "Shunichi Horigome"},
  {name = "Ariane Dekker"},
]
dependencies = [
  "sashimi-itamae>=0.1.0a4",
  "numpy>=1.26",
  "scipy>=1.11",
  "tqdm>=4.66",
]

[project.optional-dependencies]
demo = [
  "ipykernel>=6",
  "matplotlib>=3.8",
  "nbconvert>=7",
]
itamae = [
]
test = [
  "pytest>=8",
  "setuptools>=77",
]

[project.urls]
Repository = "https://github.com/gomeshun/sashimi-c"

[tool.setuptools]
py-modules = [
  "boost_iteration",
  "boost_iteration_prompt_cusps",
  "prompt_cusps",
  "picard_tidal_stripping",
  "sashimi_c",
  "sashimi_c_physics",
  "sashimi_c_data",
  "sashimi_c_itamae",
  "sashimi_c_itamae_catalog",
  "sashimi_c_itamae_components",
  "sashimi_c_itamae_migration",
  "sashimi_c_itamae_variance",
]

[tool.setuptools.data-files]
"share/sashimi-c" = ["notebooks/usage_walkthrough.ipynb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
